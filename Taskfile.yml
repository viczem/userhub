version: "3"

includes:
  userhub:
    taskfile: ./services/userhub/Taskfile.yml
  userhub-directory:
    taskfile: ./services/userhub-directory/Taskfile.yml

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build UserHub Service and UserHub Directory
    deps:
      - userhub:build
      - userhub-directory:build

  test:
    desc: Test all modules
    deps:
      - userhub:test
      - userhub-directory:test

  verify-boundaries:
    desc: Verify UserHub implementation boundaries
    cmds:
      - |
        if go list -deps ./services/userhub/... | grep -Eq '^github.com/viczem/userhub/services/(iam|identity)($|/)'; then
          echo "UserHub Service must not import removed service implementations" >&2
          exit 1
        fi
      - |
        if go list -deps ./services/userhub/... | grep -Eq '^github.com/viczem/userhub/services/userhub-directory/internal($|/)'; then
          echo "UserHub Service must not import UserHub Directory implementation packages" >&2
          exit 1
        fi

  verify-workspace:
    desc: Verify workspace module resolution
    cmds:
      - go list -m github.com/viczem/userhub/services/userhub
      - go list -m github.com/viczem/userhub/services/userhub-directory

  verify:
    desc: Verify the UserHub module and service boundaries
    deps:
      - userhub:verify
      - userhub-directory:verify
      - verify-boundaries
      - verify-workspace

  images:
    desc: Build the UserHub Service and UserHub Directory images
    deps:
      - userhub:image
      - userhub-directory:image
