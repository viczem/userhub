root = "."
tmp_dir = "/tmp/userhub-air"
env_files = [".env"]

[build]
cmd = "go build -o /tmp/userhub-air/userhub ./cmd"
entrypoint = ["/tmp/userhub-air/userhub", "start"]
include_ext = ["go", "sql"]
include_file = ["go.mod", "go.sum", ".env"]
exclude_regex = ["_test\\.go"]
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = 1000000000

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
