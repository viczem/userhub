version: "3"

vars:
  IAM_IMAGE: '{{default "userhub/iam:dev" .IAM_IMAGE}}'
  ROOT_DIR: "{{.TASKFILE_DIR}}/../.."

tasks:
  build:
    desc: Build IAM packages
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - go build ./...

  test:
    desc: Test IAM packages
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - go test ./...

  verify:
    desc: Verify the IAM module
    deps:
      - test
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - go mod tidy -diff
      - go vet ./...

  migration-create:
    desc: Create the next sequential IAM migration pair (NAME=example_name)
    dir: "{{.TASKFILE_DIR}}"
    requires:
      vars:
        - NAME
    cmds:
      - go run ./migrations/cmd.go create "{{.NAME}}"

  migration-up:
    desc: Apply all pending IAM migrations (requires DB_URL in the environment)
    dir: "{{.TASKFILE_DIR}}"
    dotenv:
      - "{{.TASKFILE_DIR}}/.env"
    cmds:
      - go run ./migrations/cmd.go up

  migration-down:
    desc: Roll back the latest IAM migration (requires DB_URL in the environment)
    dir: "{{.TASKFILE_DIR}}"
    dotenv:
      - "{{.TASKFILE_DIR}}/.env"
    cmds:
      - go run ./migrations/cmd.go down

  image:
    desc: Build the IAM container image
    cmds:
      - >-
        docker build
        --file "{{.TASKFILE_DIR}}/Dockerfile"
        --tag "{{.IAM_IMAGE}}"
        "{{.ROOT_DIR}}"
