root = "."
tmp_dir = "/tmp/userhub-directory-air"

[build]
cmd = "go build -o /tmp/userhub-directory-air/userhub-directory ./cmd"
entrypoint = ["/tmp/userhub-directory-air/userhub-directory", "start"]
include_ext = ["go", "sql"]
include_file = ["go.mod", "go.sum"]
exclude_regex = ["_test\\.go"]
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = 1000000000

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
