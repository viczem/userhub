version: "3"

vars:
  USERHUB_DIRECTORY_IMAGE: '{{default "userhub/userhub-directory:dev" .USERHUB_DIRECTORY_IMAGE}}'
  ROOT_DIR: "{{.TASKFILE_DIR}}/../.."

tasks:
  build:
    desc: Build UserHub Directory packages
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - go build -o /tmp/userhub-directory ./cmd

  test:
    desc: Test UserHub Directory packages
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - go test ./...

  cmd:
    desc: "Run UserHub Directory CLI (usage: task userhub-directory:cmd -- <arguments>)"
    dir: "{{.TASKFILE_DIR}}"
    dotenv:
      - "{{.TASKFILE_DIR}}/.env"
    cmds:
      - go run ./cmd {{.CLI_ARGS}}

  dev:
    desc: Run UserHub Directory with automatic reload after source changes
    dir: "{{.TASKFILE_DIR}}"
    env:
      APP_ENV: development
    cmds:
      - go tool air -c .air.toml

  verify:
    desc: Verify the UserHub Directory module
    deps:
      - test
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - go mod tidy -diff
      - go vet ./...

  migration-create:
    desc: Create the next sequential UserHub Directory migration pair (NAME=example_name)
    dir: "{{.TASKFILE_DIR}}"
    requires:
      vars:
        - NAME
    cmds:
      - go run ./migrations/cmd.go create "{{.NAME}}"

  migration-up:
    desc: Apply all pending UserHub Directory migrations (requires DB_URL in the environment)
    dir: "{{.TASKFILE_DIR}}"
    dotenv:
      - "{{.TASKFILE_DIR}}/.env"
    cmds:
      - go run ./migrations/cmd.go up

  migration-down:
    desc: Roll back the latest UserHub Directory migration (requires DB_URL in the environment)
    dir: "{{.TASKFILE_DIR}}"
    dotenv:
      - "{{.TASKFILE_DIR}}/.env"
    cmds:
      - go run ./migrations/cmd.go down

  image:
    desc: Build the UserHub Directory container image
    cmds:
      - >-
        docker build
        --file "{{.TASKFILE_DIR}}/Dockerfile"
        --tag "{{.USERHUB_DIRECTORY_IMAGE}}"
        "{{.ROOT_DIR}}"
